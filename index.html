<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Census Data Viewers</title>
    <link rel="stylesheet" href="springcensus.css">
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 50px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        .card {
            min-width: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .card-content h2 {
            margin: 0;
            color: #007bff;
        }
        .card-content p {
            margin: 10px 0 0;
            color: #666;
        }
        h1 {
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Census Data Viewers</h1>
        
        <div class="dashboard">
            <a href="springcensus.html" class="card">
                <img src="https://picsum.photos/seed/spring/800/600?blur=1" alt="Spring Census">
                <div class="card-content">
                    <h2>Spring Census</h2>
                    <p>View collected data for spring schedules</p>
                </div>
            </a>
            
            <a href="waterbodyschedule.html" class="card">
                <img src="https://picsum.photos/seed/water/800/600?blur=1" alt="Water Body Schedule">
                <div class="card-content">
                    <h2>Water Body Schedule</h2>
                    <p>View collected data for water body schedules</p>
                </div>
            </a>

            <a href="surfacewaterscheme.html" class="card">
                <img src="https://picsum.photos/seed/dam/800/600?blur=1" alt="Surface Water Scheme">
                <div class="card-content">
                    <h2>Surface Water Scheme</h2>
                    <p>View collected data for surface water schemes</p>
                </div>
            </a>

            <a href="groundwaterscheme.html" class="card">
                <img src="https://picsum.photos/seed/water-well/800/600?blur=1" alt="Ground Water Scheme">
                <div class="card-content">
                    <h2>Ground Water Scheme</h2>
                    <p>View collected data for ground water schemes</p>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Use random images from the local img folder if possible, 
        // but for "hdr" feel and simplicity, picsum with seeds is great.
        // If the user strictly wanted local random images:
        /*

            'img/S-R-30-551-5929-626670-01_w_6997f622b4bf2.jpg'
        ];
        // However, picsum provides a better "HDR" aesthetic for a dashboard.
        */
    </script>
</body>
</html>
