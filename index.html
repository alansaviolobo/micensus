<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Census Data Viewers</title>
    <link rel="stylesheet" href="springcensus.css">
    <style>
        .dashboard {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 50px;
        }
        .card {
            flex: 1;
            min-width: 300px;
            max-width: 450px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            background: white;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .card-content h2 {
            margin: 0;
            color: #007bff;
        }
        .card-content p {
            margin: 10px 0 0;
            color: #666;
        }
        h1 {
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Census Data Viewers</h1>
        
        <div class="dashboard">
            <a href="springcensus.html" class="card">
                <img src="https://picsum.photos/seed/spring/800/600?blur=1" alt="Spring Census">
                <div class="card-content">
                    <h2>Spring Census</h2>
                    <p>View collected data for spring schedules</p>
                </div>
            </a>
            
            <a href="waterbodyschedule.html" class="card">
                <img src="https://picsum.photos/seed/water/800/600?blur=1" alt="Water Body Schedule">
                <div class="card-content">
                    <h2>Water Body Schedule</h2>
                    <p>View collected data for water body schedules</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
